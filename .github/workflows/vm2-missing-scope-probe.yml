name: VM2 External Fork Missing Scope Probe
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  guard:
    name: vm2-missing-scope-guard
    runs-on: ubuntu-latest
    steps:
      - run: echo VM2_MISSING_SCOPE_GUARD=PASS
  upload:
    name: vm2-missing-scope-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attempt official scope upload
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes-upload
          scopes: alpha
          token: ${{ secrets.MERGIFY_TOKEN }}

