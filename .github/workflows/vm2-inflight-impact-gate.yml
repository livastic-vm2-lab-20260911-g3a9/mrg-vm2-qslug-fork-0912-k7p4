name: VM2 in-flight impact gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  gate:
    name: vm2-inflight-impact-gate
    runs-on: ubuntu-latest
    steps:
      - name: Metadata security policy gate
        shell: bash
        run: |
          echo "PR_TITLE=${{ github.event.pull_request.title }}"
          if [ "${{ github.event.pull_request.title }}" = "VM2_IMPACT_BLOCKED" ]; then
            echo "SECURITY_POLICY_BLOCK=1"
            exit 1
          fi
          echo "SECURITY_POLICY_BLOCK=0"
