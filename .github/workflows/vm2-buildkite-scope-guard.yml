name: VM2 Buildkite scope guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  guard:
    name: vm2-buildkite-scope-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject combined A+B state
        shell: bash
        run: |
          if [[ -f vm2-bk-a.txt && -f vm2-bk-b.txt ]]; then
            echo 'VM2_COMBINED_SCOPE_GUARD=FAIL'
            exit 1
          fi
          echo 'VM2_COMBINED_SCOPE_GUARD=PASS'
