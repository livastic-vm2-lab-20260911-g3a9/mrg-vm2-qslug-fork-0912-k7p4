name: VM2 Buildkite scope guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  guard:
    name: vm2-buildkite-scope-guard
    runs-on: ubuntu-latest
    steps:
      - name: Reject Mergify merge-queue draft only
        shell: bash
        run: |
          echo "VM2_HEAD_REF=${GITHUB_HEAD_REF}"
          if [[ "${GITHUB_HEAD_REF}" == mergify/merge-queue/* ]]; then
            echo 'VM2_RETRY_LINEAGE_GUARD=FAIL_DRAFT'
            exit 1
          fi
          echo 'VM2_RETRY_LINEAGE_GUARD=PASS_ORIGINAL'
