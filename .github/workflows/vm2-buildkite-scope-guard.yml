name: VM2 Buildkite scope guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  guard:
    name: vm2-buildkite-scope-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hold only Mergify queue draft
        shell: bash
        run: |
          echo "VM2_HEAD_REF=${GITHUB_HEAD_REF}"
          if [[ "${GITHUB_HEAD_REF}" == mergify/merge-queue/* ]]; then
            echo 'VM2_SCOPE_OVERLAP_DRAFT_WAIT=1'
            sleep 45
          fi
      - name: Reject combined overlap state
        shell: bash
        run: |
          if [[ -f vm2-overlap-a.txt && -f vm2-overlap-b.txt ]]; then
            echo 'VM2_SCOPE_OVERLAP_GUARD=FAIL_COMBINED'
            exit 1
          fi
          echo 'VM2_SCOPE_OVERLAP_GUARD=PASS_SINGLE'
