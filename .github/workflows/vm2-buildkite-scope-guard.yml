name: VM2 Ahead Close Guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  guard:
    name: vm2-ahead-close-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Queue close-lineage oracle
        shell: bash
        run: |
          echo "VM2_HEAD_REF=${GITHUB_HEAD_REF}"
          if [[ "${GITHUB_HEAD_REF}" != mergify/merge-queue/* ]]; then
            echo 'VM2_AHEAD_CLOSE_ORIGINAL_PASS'
            exit 0
          fi
          echo 'VM2_AHEAD_CLOSE_DRAFT_WAIT=1'
          sleep 35
          A=0; B=0
          [[ -f vm2-aheadclose-a.txt ]] && A=1
          [[ -f vm2-aheadclose-b.txt ]] && B=1
          echo "VM2_AHEAD_CLOSE_STATE=A${A}B${B}"
          if [[ "$A" == 1 && "$B" == 1 ]]; then
            echo 'VM2_AHEAD_CLOSE_GUARD=PASS_COMBINED'
            exit 0
          fi
          if [[ "$A" == 1 || "$B" == 1 ]]; then
            echo 'VM2_AHEAD_CLOSE_GUARD=FAIL_SINGLE'
            exit 1
          fi
          echo 'VM2_AHEAD_CLOSE_GUARD=PASS_BASE'
