name: VM2 Ahead Edit Guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  guard:
    name: vm2-ahead-edit-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Queue ahead-edit oracle
        shell: bash
        run: |
          echo "VM2_HEAD_REF=${GITHUB_HEAD_REF}"
          if [[ "${GITHUB_HEAD_REF}" != mergify/merge-queue/* ]]; then
            echo 'VM2_AHEAD_EDIT_ORIGINAL_PASS'
            exit 0
          fi
          echo 'VM2_AHEAD_EDIT_DRAFT_WAIT=1'
          sleep 40
          EDIT=0; B=0
          [[ -f vm2-ahedit-edit.txt ]] && EDIT=1
          [[ -f vm2-ahedit-b.txt ]] && B=1
          echo "VM2_AHEAD_EDIT_STATE=EDIT${EDIT}B${B}"
          if [[ "$EDIT" == 1 && "$B" == 1 ]]; then
            echo 'VM2_AHEAD_EDIT_GUARD=FAIL_EDIT_PLUS_B'
            exit 1
          fi
          echo 'VM2_AHEAD_EDIT_GUARD=PASS'
