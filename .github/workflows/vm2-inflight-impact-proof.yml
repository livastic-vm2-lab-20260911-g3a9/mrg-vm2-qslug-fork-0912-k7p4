name: VM2 in-flight status impact proof
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Prove trusted-main OIDC and repository write
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC_PRESENT=1"
          else
            echo "OIDC_PRESENT=0"
            exit 1
          fi
          response=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          token=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          printf '%s' "$token" | python3 -c 'import sys,json,base64; t=sys.stdin.read().strip(); p=t.split(".")[1]; p += "="*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p)); print("OIDC_AUD="+str(c.get("aud"))); print("OIDC_REPOSITORY="+str(c.get("repository"))); print("OIDC_REF="+str(c.get("ref"))); print("OIDC_SHA="+str(c.get("sha"))); print("OIDC_ACTOR="+str(c.get("actor"))); print("OIDC_EVENT_NAME="+str(c.get("event_name")))'
          branch="vm2-inflight-impact-proof-${GITHUB_SHA:0:12}"
          payload=$(printf '{"ref":"refs/heads/%s","sha":"%s"}' "$branch" "$GITHUB_SHA")
          code=$(curl -sS -o /tmp/ref-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
            -d "$payload")
          echo "GITHUB_TOKEN_BRANCH_CREATE_HTTP=$code"
          if [ "$code" = "201" ]; then
            echo "GITHUB_TOKEN_WRITE_SUCCEEDED=1"
          else
            echo "GITHUB_TOKEN_WRITE_SUCCEEDED=0"
            cat /tmp/ref-response.json
            exit 1
          fi

