pull_request_rules:
  - name: VM2 gitlink no-config-change automerge guard
    conditions:
      - author = livastic-vm2-secondary-20260911
      - from-fork
      - title = VM2_GITLINK_GUARD_TRIGGER
      - -mergify-configuration-changed
    actions:
      merge:
        method: merge
# VM2 regular-file config-change control

  - name: VM2 semantic config-change control only
    conditions:
      - title = VM2_NEVER_MATCH_SEMANTIC_CONTROL
    actions:
      comment:
        message: VM2_SEMANTIC_CONTROL_ONLY
