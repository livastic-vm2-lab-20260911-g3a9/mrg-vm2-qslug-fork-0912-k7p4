merge_queue:
  mode: parallel
  max_parallel_checks: 2
scopes:
  source:
    manual:
  default_capacity: 1
merge_protections_settings:
  auto_merge_conditions: true
queue_rules:
  - name: vm2-buildkite-scope-impact
    batch_size: 1
    merge_method: merge
    queue_conditions:
      - title ~= ^VM2_BK3_QUEUE_
      - check-success = @github-actions/vm2-buildkite-scope-guard
    merge_conditions:
      - title ~= ^VM2_BK3_QUEUE_
      - check-success = @github-actions/vm2-buildkite-scope-guard
      - check-success = vm2-never-pass
