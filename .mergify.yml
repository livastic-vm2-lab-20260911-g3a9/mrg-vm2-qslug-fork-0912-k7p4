merge_queue:
  max_parallel_checks: 2
merge_protections_settings:
  auto_merge_conditions: true
queue_rules:
  - name: vm2-ahead-failed
    batch_size: 1
    merge_method: merge
    queue_conditions:
      - title ~= ^VM2_AHEADFAIL_
    merge_conditions:
      - check-success = @github-actions/vm2-ahead-failure-guard
