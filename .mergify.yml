queue_rules:
  - name: vm2-inflight-impact-probe
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
    branch_protection_injection_mode: merge
    queue_conditions:
      - title ~= ^VM2_IMPACT_
    merge_conditions: []
merge_protections_settings:
  auto_merge_conditions: true
